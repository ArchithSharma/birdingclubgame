<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name That Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EBDA;
    --paper-dark:#E8DFC8;
    --ink:#20301F;
    --forest:#2B4531;
    --forest-deep:#1B2E1C;
    --gold:#B4872E;
    --rust:#A6402F;
    --rust-deep:#7E2E21;
    --line:#c9bd9c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:32px 16px 48px;
    background:
      radial-gradient(circle at 20% 10%, #f8f2e2 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:560px;
  }
  header{
    text-align:left;
    margin-bottom:22px;
    border-bottom:2px solid var(--forest);
    padding-bottom:14px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(30px, 6vw, 42px);
    margin:0 0 4px;
    color:var(--forest-deep);
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-size:15px;
    color:#4c5a45;
    max-width:44ch;
    line-height:1.5;
  }
  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:18px 0 10px;
    font-size:14px;
    color:#5a6752;
  }
  .status-row .round{
    font-family:'Fraunces', serif;
    font-size:17px;
    color:var(--forest-deep);
  }
  .card{
    background:#fbf8ef;
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 10px 24px -18px rgba(27,46,28,0.4);
    padding:18px;
  }
  .photo-frame{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:#e4dcc4;
    border:1px solid var(--line);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .loading-text, .error-text{
    font-size:14px;
    color:#7a7052;
    text-align:center;
    padding:0 20px;
  }
  .credit{
    font-size:11.5px;
    color:#8c8262;
    margin:6px 2px 0;
    text-align:right;
  }
  .credit a{ color:#8c8262; }
  .guess-form{
    display:flex;
    gap:9px;
    margin-top:16px;
  }
  .guess-form input{
    flex:1;
    min-width:0;
    font-family:'Inter', sans-serif;
    font-size:15.5px;
    padding:13px 14px;
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--ink);
  }
  .guess-form input:focus{
    outline:none;
    border-color:var(--forest);
  }
  .guess-form input.correct{
    border-color:var(--forest);
    background:#e7f0e2;
    color:var(--forest-deep);
  }
  .guess-form input.wrong{
    border-color:var(--rust);
    background:#f6e6e1;
    color:var(--rust-deep);
  }
  .guess-form input:disabled{ cursor:default; }
  .guess-btn{
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:600;
    padding:13px 18px;
    background:var(--forest-deep);
    color:#f2ebda;
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .guess-btn:hover:not(:disabled){ background:var(--forest); }
  .guess-btn:disabled{ opacity:.5; cursor:default; }
  .skip-btn{
    display:block;
    margin:9px auto 0;
    background:none;
    border:none;
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:#8c8262;
    text-decoration:underline;
    cursor:pointer;
    padding:2px;
  }
  .skip-btn:disabled{ visibility:hidden; }
  .feedback{
    margin-top:14px;
    padding:12px 14px;
    font-size:14.5px;
    line-height:1.5;
    border-left:4px solid var(--forest);
    background:#eef3ea;
    display:none;
  }
  .feedback.wrong{
    border-left-color:var(--rust);
    background:#f7ece8;
  }
  .feedback b{ font-family:'Fraunces', serif; font-size:16px; }
  .next-btn{
    margin-top:16px;
    width:100%;
    padding:13px;
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    background:var(--forest-deep);
    color:#f2ebda;
    border:none;
    cursor:pointer;
    display:none;
  }
  .next-btn:hover{ background:var(--forest); }

  .end-screen{ display:none; text-align:center; padding:8px 4px; }
  .end-score-label{ font-size:13.5px; color:#5a6752; margin-bottom:2px; }
  .end-score{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:56px;
    color:var(--forest-deep);
    line-height:1;
    margin-bottom:6px;
  }
  .end-msg{ font-size:15px; color:#4c5a45; margin-bottom:20px; }
  .recap{
    text-align:left;
    list-style:none;
    margin:0 0 22px;
    padding:0;
    border-top:1px solid var(--line);
  }
  .recap li{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:14.5px;
    padding:9px 2px;
    border-bottom:1px solid var(--line);
  }
  .recap li span:first-child{ color:#5a6752; }
  .recap li.right span:last-child{ color:var(--forest-deep); font-weight:600; }
  .recap li.miss span:last-child{ color:var(--rust-deep); font-weight:600; }
  .play-again{
    width:100%;
    padding:14px;
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    background:var(--rust-deep);
    color:#f2ebda;
    border:none;
    cursor:pointer;
  }
  .play-again:hover{ background:var(--rust); }

  .qr-section{
    margin-top:34px;
    padding-top:24px;
    border-top:2px solid var(--forest);
    display:flex;
    align-items:center;
    gap:18px;
  }
  .qr-section a{
    color:inherit;
    text-decoration:none;
  }
  .qr-section img{
    width:104px;
    height:104px;
    border:1px solid var(--line);
    background:#fff;
    padding:6px;
    flex-shrink:0;
    display:block;
    transition:border-color .15s ease;
  }
  .qr-section a:hover img,
  .qr-section a:focus-visible img{
    border-color:var(--forest);
  }
  .qr-text .qr-eyebrow{
    font-family:'Fraunces', serif;
    font-size:17px;
    color:var(--forest-deep);
    margin-bottom:4px;
  }
  .qr-text p{
    font-size:13.5px;
    color:#5a6752;
    line-height:1.5;
    margin:0;
  }
  .qr-text p a{
    color:var(--rust-deep);
    text-decoration:underline;
  }
  .qr-text p a:hover{ color:var(--rust); }
  @media (max-width:420px){
    .qr-section{ flex-direction:column; text-align:center; }
  }
</style>
</head>

<div class="wrap">

  <header>
    <h1>Name That Bird</h1>
    <div class="subtitle">You'll see five photos of North American birds. Type the name for each one — get it wrong and we'll tell you what it actually is.</div>

      <input type="text" id="guessInput" placeholder="Type the bird's name…" autocomplete="off" autocapitalize="words">
      <button type="submit" class="guess-btn" id="guessBtn">Guess</button>
    </form>
    <button type="button" class="skip-btn" id="skipBtn">Not sure? Skip this one</button>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Next bird</button>
  </div>

  <div class="card end-screen" id="endScreen">
    <div class="end-score-label">You scored</div>
    <div class="end-score" id="finalScore">0/5</div>
    <div class="end-msg" id="endMsg"></div>
    <ul class="recap" id="recap"></ul>
    <button class="play-again" id="playAgainBtn">Play again</button>

function normalize(s){
  return s
    .toLowerCase()
    .replace(/[^a-z\s-]/g, '')
    .replace(/\b(a|an|the)\b/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for(let i = 0; i <= m; i++) dp[i][0] = i;
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }
  return dp[m][n];
}

function closeEnough(guess, target){
  if(guess === target) return true;
  const tolerance = target.length <= 5 ? 1 : (target.length <= 9 ? 2 : 3);
  return levenshtein(guess, target) <= tolerance;
}

function isCorrectGuess(rawGuess, bird){
  const guess = normalize(rawGuess);
  if(!guess) return false;
  const targets = [bird.name, ...(bird.aliases || [])].map(normalize);
  return targets.some(t => closeEnough(guess, t));
}

const ROUNDS = 5;
let deck = [];        // birds chosen for this game
let imageCache = {};  // wiki -> {src, pageUrl}
let round = 0;
let score = 0;
let history = [];     // {bird, correct: bool, picked}
let locked = false;

const roundLabel = document.getElementById('roundLabel');
const scoreLabel = document.getElementById('scoreLabel');
const photoFrame = document.getElementById('photoFrame');
const creditEl = document.getElementById('credit');
const guessForm = document.getElementById('guessForm');
const guessInput = document.getElementById('guessInput');
const guessBtn = document.getElementById('guessBtn');
const skipBtn = document.getElementById('skipBtn');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const gameCard = document.getElementById('gameCard');
const endScreen = document.getElementById('endScreen');
const finalScoreEl = document.getElementById('finalScore');
const endMsgEl = document.getElementById('endMsg');
const recapEl = document.getElementById('recap');
const playAgainBtn = document.getElementById('playAgainBtn');

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDeck(){
  deck = shuffle(BIRDS).slice(0, ROUNDS);
}

async function fetchBirdImage(bird){
  if(imageCache[bird.wiki]) return imageCache[bird.wiki];
  const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(bird.wiki)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('lookup failed');
  const data = await res.json();
  const src = (data.originalimage && data.originalimage.source) ||
              (data.thumbnail && data.thumbnail.source);
  if(!src) throw new Error('no image');
  const info = { src, pageUrl: data.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${bird.wiki}` };
  imageCache[bird.wiki] = info;
  return info;
}

async function loadRound(){
  locked = false;
  feedbackEl.style.display = 'none';
  feedbackEl.className = 'feedback';
  nextBtn.style.display = 'none';
  guessForm.style.display = 'flex';
  guessInput.value = '';
  guessInput.className = '';
  guessInput.disabled = false;
  guessBtn.disabled = false;
  skipBtn.disabled = false;
  creditEl.textContent = '';
  photoFrame.innerHTML = '<div class="loading-text">Fetching a photo…</div>';

  roundLabel.textContent = `Bird ${round + 1} of ${ROUNDS}`;
  scoreLabel.textContent = `Score: ${score}`;

  const bird = deck[round];
  let info;
  try{
    info = await fetchBirdImage(bird);
  }catch(e){
    photoFrame.innerHTML = '<div class="error-text">Couldn\'t load a photo for this one — skipping ahead.</div>';
    setTimeout(() => advance(true), 900);
    return;
  }

  const img = new Image();
  img.alt = 'Mystery bird';
  img.onload = () => {
    photoFrame.innerHTML = '';
    photoFrame.appendChild(img);
    creditEl.innerHTML = `Photo via <a href="${info.pageUrl}" target="_blank" rel="noopener">Wikipedia</a>`;
    guessInput.focus();
  };
  img.onerror = () => {
    photoFrame.innerHTML = '<div class="error-text">Couldn\'t load a photo for this one — skipping ahead.</div>';
    setTimeout(() => advance(true), 900);
  };
  img.src = info.src;
}

function submitGuess(rawGuess, skipped){
  if(locked) return;
  locked = true;

  const correctBird = deck[round];
  const isCorrect = !skipped && isCorrectGuess(rawGuess, correctBird);
  if(isCorrect) score++;

  guessInput.disabled = true;
  guessBtn.disabled = true;
  skipBtn.disabled = true;
  guessInput.classList.add(isCorrect ? 'correct' : 'wrong');

  feedbackEl.style.display = 'block';
  if(isCorrect){
    feedbackEl.classList.remove('wrong');
    feedbackEl.innerHTML = `<b>Correct.</b> That's a ${correctBird.name}.`;
  } else if(skipped){
    feedbackEl.classList.add('wrong');
    feedbackEl.innerHTML = `<b>Skipped.</b> That's a ${correctBird.name}.`;
  } else {
    feedbackEl.classList.add('wrong');
    feedbackEl.innerHTML = `<b>Not quite.</b> You guessed "${rawGuess.trim()}" — that's actually a ${correctBird.name}.`;
  }

  history.push({ bird: correctBird.name, correct: isCorrect, skipped: !!skipped && !isCorrect });
  scoreLabel.textContent = `Score: ${score}`;
  nextBtn.style.display = 'block';
  nextBtn.textContent = (round === ROUNDS - 1) ? 'See your results' : 'Next bird';
}

guessForm.addEventListener('submit', (e) => {
  e.preventDefault();
  if(!guessInput.value.trim()) return;
  submitGuess(guessInput.value, false);
});

skipBtn.addEventListener('click', () => submitGuess('', true));

function advance(skipped){
  if(skipped) history.push({ bird: deck[round].name, correct: false, skipped: true });
  round++;
  if(round >= ROUNDS){
    showEnd();
  } else {
    loadRound();
  }
}

nextBtn.addEventListener('click', () => advance(false));

function showEnd(){
  gameCard.style.display = 'none';
  endScreen.style.display = 'block';
  finalScoreEl.textContent = `${score}/${ROUNDS}`;

  let msg;
  if(score === ROUNDS) msg = "A clean sweep — you know your birds.";
  else if(score >= ROUNDS - 1) msg = "Sharp eye out there.";
  else if(score >= ROUNDS / 2) msg = "Solid instincts, a bit more field time and you'll have it.";
  else msg = "Birding takes practice — give it another go.";
  endMsgEl.textContent = msg;

  recapEl.innerHTML = '';
  history.forEach(h => {
    const li = document.createElement('li');
    li.className = h.correct ? 'right' : 'miss';
    li.innerHTML = `<span>${h.bird}</span><span>${h.correct ? 'Correct' : (h.skipped ? 'Skipped' : 'Missed')}</span>`;
    recapEl.appendChild(li);
  });
}

playAgainBtn.addEventListener('click', () => {
  round = 0;
  score = 0;
  history = [];
  endScreen.style.display = 'none';
  gameCard.style.display = 'block';
  pickDeck();
  loadRound();
});
